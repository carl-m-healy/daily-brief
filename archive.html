<!DOCTYPE html>
<html class="staticrypt-html" lang="en">
    <head>
        <meta charset="utf-8" />
        <title>The Daily Brief</title>
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="robots" content="noindex,nofollow" />
        <meta name="referrer" content="no-referrer" />
        <meta name="color-scheme" content="light dark" />
        <meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)" />
        <meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)" />
        <!-- installed app ("Chrome app"): manifest + service worker live in the unencrypted wrapper so Chrome sees them
             before the password / remember-me decrypt; the decrypted page repeats both (document.write replaces this head) -->
        <link rel="manifest" href="/daily-brief/manifest.webmanifest" />
        <link rel="icon" type="image/png" sizes="192x192" href="/daily-brief/icons/icon-192.png" />
        <link rel="apple-touch-icon" href="/daily-brief/icons/apple-180.png" />
        <meta name="mobile-web-app-capable" content="yes" />
        <script>
            if ("serviceWorker" in navigator) {
                navigator.serviceWorker.register("/daily-brief/sw.js", { scope: "/daily-brief/", updateViaCache: "none" }).catch(function () {});
            }
        </script>

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <style>
            :root{--bg:#fbfaf7;--fg:#1d1d1f;--muted:#5f6368;--rule:#e3e0d8;--accent:#b3261e;--card:#ffffff;--field:#f4f2ec}
            @media (prefers-color-scheme:dark){:root{--bg:#121214;--fg:#e8e6e3;--muted:#a0a4ab;--rule:#2c2c31;--accent:#ff8a80;--card:#1a1a1e;--field:#24242a}}
            *{box-sizing:border-box}
            .staticrypt-html{height:100%;background:var(--bg)}
            .staticrypt-body{min-height:100%;margin:0;background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
            .staticrypt-content{min-height:100%;font-family:Inter,"Helvetica Neue",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
            .staticrypt-page{width:100%;max-width:420px;margin:0 auto;padding:12vh 20px 40px}
            .staticrypt-form{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:32px 24px 26px;text-align:left}
            .staticrypt-instructions{margin:0 0 6px}
            .staticrypt-title{font-family:"Source Serif 4","Source Serif Pro",Charter,"Iowan Old Style",Georgia,serif;font-size:32px;line-height:1.1;font-weight:700;letter-spacing:-.015em;margin:0 0 10px;text-align:center;padding-bottom:14px;border-bottom:3px double var(--rule)}
            .staticrypt-instructions p:last-child{color:var(--muted);font-size:15px;line-height:1.45;margin:14px 0 0;text-align:center}
            .staticrypt-hr{border:0;margin:14px 0}
            .staticrypt-password-container{position:relative;width:100%;margin:0 0 14px;background:var(--field);border:1px solid var(--rule);border-radius:8px}
            .staticrypt-form input[type="password"],.staticrypt-form input[type="text"]{background:transparent;color:var(--fg);border:0;outline:0;width:100%;font-size:17px;padding:14px 46px 14px 14px;border-radius:8px;font-family:inherit}
            .staticrypt-password-container:focus-within{border-color:var(--accent)}
            .staticrypt-toggle-password-visibility{cursor:pointer;height:20px;width:20px;opacity:.55;position:absolute;right:13px;top:50%;transform:translateY(-50%)}
            @media (prefers-color-scheme:dark){.staticrypt-toggle-password-visibility{filter:invert(1)}}
            label.staticrypt-remember{display:flex;align-items:center;gap:12px;margin:0 0 18px;font-size:15px;color:var(--muted)}
            .staticrypt-remember input[type="checkbox"]{width:20px;height:20px;margin:0;accent-color:var(--accent)}
            .staticrypt-form .staticrypt-decrypt-button{width:100%;border:0;border-radius:8px;padding:15px;font-size:16px;font-weight:600;letter-spacing:.02em;color:#fff;background:var(--accent);cursor:pointer;font-family:inherit;-webkit-appearance:none;appearance:none}
            .staticrypt-form .staticrypt-decrypt-button:hover,.staticrypt-form .staticrypt-decrypt-button:focus{filter:brightness(92%)}
            .hidden{display:none !important}
            .staticrypt-spinner-container{height:100vh;display:flex;align-items:center;justify-content:center}
            .staticrypt-spinner{display:inline-block;width:2rem;height:2rem;border:.25em solid var(--muted);border-right-color:transparent;border-radius:50%;animation:spinner-border .75s linear infinite}
            @keyframes spinner-border{100%{transform:rotate(360deg)}}
        </style>
    </head>

    <body class="staticrypt-body">
        <div id="staticrypt_loading" class="staticrypt-spinner-container">
            <div class="staticrypt-spinner"></div>
        </div>

        <div id="staticrypt_content" class="staticrypt-content hidden">
            <div class="staticrypt-page">
                <div class="staticrypt-form">
                    <div class="staticrypt-instructions">
                        <p class="staticrypt-title">The Daily Brief</p>
                        <p>Enter the password to read. This device will remember it, so you only need to do this once.</p>

                        </div>

                            <input id="staticrypt-remember" type="checkbox" name="remember" checked />
                            Remember on this device
                        </label>

                        <input type="submit" class="staticrypt-decrypt-button" value="Open" />
                    </form>
                </div>
            </div>
        </div>
